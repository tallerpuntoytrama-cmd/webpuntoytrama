<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" seed="12" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="discrete" tableValues=".4 .64 .88 1 1"/>
      <feFuncG type="discrete" tableValues=".4 .64 .88 1 1"/>
      <feFuncB type="discrete" tableValues=".4 .64 .88 1 1"/>
      <feFuncA type="linear" slope="0" intercept="1"/>
    </feComponentTransfer>
  </filter>
  <rect width="240" height="240" fill="white" filter="url(#grain)"/>
</svg>
